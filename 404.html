<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slot empty — EdinCard Vending</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14151A; --cream:#F0EAD9; --teal:#2FBFA6; --magenta:#E1508A; --slate:#9297A1; --ink-line:#2B2E38;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--ink); color:var(--cream); font-family:"Inter",sans-serif; text-align:center; padding:24px;
  }
  .code{
    font-family:"IBM Plex Mono",monospace; font-size:0.8rem; letter-spacing:0.1em; color:var(--teal);
    margin-bottom:18px; text-transform:uppercase;
  }
  h1{ font-family:"Space Grotesk",sans-serif; font-size:clamp(1.8rem,5vw,2.6rem); margin:0 0 14px; }
  p{ color:var(--slate); max-width:44ch; margin:0 auto 28px; }
  .slot{
    width:64px; height:74px; margin:0 auto 28px; border-radius:8px;
    background:#1B1D24; border:1px solid var(--ink-line);
    display:flex; align-items:center; justify-content:center;
    font-family:"IBM Plex Mono",monospace; color:var(--magenta); font-size:0.8rem;
  }
  a{
    display:inline-flex; align-items:center; justify-content:center;
    background:linear-gradient(120deg,var(--teal),#24a390); color:#0C1613;
    font-weight:600; padding:12px 24px; border-radius:999px; text-decoration:none;
  }
</style>
</head>
<body>
  <div>
    <p class="code">SLOT NOT FOUND</p>
    <div class="slot" aria-hidden="true">--</div>
    <h1>This slot's empty.</h1>
    <p>Whatever you were looking for isn't at this address. Head back and pick a different one.</p>
    <a href="/">Back to EdinCard Vending</a>
  </div>
</body>
</html>
